<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fraud Detection</title>
   <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h2>Fraud Detection System</h2>

    <form id="fraudForm">
        <label>Amount</label>
        <input type="number" id="amount" required>

        <label>Time</label>
        <input type="number" id="time" required>

        <label>Model</label>
        <select id="model">
            <option value="rf">Random Forest</option>
            <option value="logistic">Logistic Regression</option>
        </select>

        <button type="submit">Check Fraud</button>
        <p class="note">Demo uses Amount and Time only. V1-V28 are anonymized bank features.</p>
        <button type="button" id="loadExample">Load fraud example</button>
    </form>

    <div id="resultCard" class="card hidden">
        <h3 id="riskLevel">Risk: </h3>
        <p id="probability"></p>
    </div>
</div>

<script>
document.getElementById("loadExample").addEventListener("click", () => {
    document.getElementById("time").value = 406;
    document.getElementById("amount").value = 1.0;
    window.exampleV = {
        V1:-2.3122,V2:1.952,V3:-1.6099,V4:3.9979,V5:-0.5222,
        V6:-1.4265,V7:-2.5374,V8:1.3917,V9:-2.7701,V10:-2.7723,
        V11:3.202,V12:-2.8999,V13:-0.5952,V14:-4.2893,V15:0.3897,
        V16:-1.1407,V17:-2.8301,V18:-0.0168,V19:0.417,V20:0.1269,
        V21:0.5172,V22:-0.035,V23:-0.4652,V24:0.3202,V25:0.0445,
        V26:0.1778,V27:0.2611,V28:-0.1433
    };
});

document.getElementById("fraudForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const model = document.getElementById("model").value;

    const vFields = window.exampleV || {
        V1:0,V2:0,V3:0,V4:0,V5:0,V6:0,V7:0,V8:0,V9:0,V10:0,
        V11:0,V12:0,V13:0,V14:0,V15:0,V16:0,V17:0,V18:0,V19:0,V20:0,
        V21:0,V22:0,V23:0,V24:0,V25:0,V26:0,V27:0,V28:0
    };

    const formData = {
        Time: parseFloat(document.getElementById("time").value),
        Amount: parseFloat(document.getElementById("amount").value),
        ...vFields
    };

    window.exampleV = null;

    const response = await fetch(`/predict?model=${model}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(formData)
    });

    const result = await response.json();

    const card = document.getElementById("resultCard");
    const riskText = document.getElementById("riskLevel");
    const probText = document.getElementById("probability");

    riskText.innerText = "Risk: " + result.risk_level;
    probText.innerText = "Fraud Probability: " + (result.fraud_probability * 100).toFixed(2) + "%";

    card.classList.remove("low", "medium", "high", "hidden");

    if (result.risk_level === "HIGH") card.classList.add("high");
    else if (result.risk_level === "MEDIUM") card.classList.add("medium");
    else card.classList.add("low");
});
</script>

</body>
</html>
